name: gps_app
description: GPS App - prototipo de app para clientes (conectada a Traccar).
publish_to: 'none'
version: 0.10.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  google_maps_flutter: ^2.9.0
  firebase_core: any
  firebase_messaging: any
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon_bg.png"
  adaptive_icon_foreground: "assets/icon_fg.png"
