name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Generar proyecto Android
        run: |
          flutter create --org cl.gpsapp --project-name gps_app --platforms android .
          rm -rf test
          python3 tool/patch_android.py

      - name: Dependencias
        run: flutter pub get

      - name: Ícono de la app
        run: dart run flutter_launcher_icons

      - name: Revisar código
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Usando la llave fija del proyecto"
          else
            echo "Sin llave fija: se usará una temporal (habrá que desinstalar para actualizar)"
          fi

      - name: Versión
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          BUILD=${{ github.run_number }}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "APK=gps-app-v$VERSION-b$BUILD.apk" >> "$GITHUB_ENV"
          echo "Versión $VERSION, compilación $BUILD"

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="$BUILD" \
            --dart-define=APP_COMMIT="${GITHUB_SHA::7}" \
            --dart-define=APP_BUILD_DATE="$(date -u +%Y-%m-%d)"

      - name: Preparar archivo
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APK"

      - uses: actions/upload-artifact@v5
        with:
          name: gps-app-apk
          path: ${{ env.APK }}
          retention-days: 30

      - name: Publicar versión descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION-b$BUILD"
          gh release create "$TAG" "$APK" \
            --prerelease \
            --title "GPS App $VERSION (compilación $BUILD)" \
            --notes "APK de prueba compilado desde ${GITHUB_SHA::7}. En el celular: descarga $APK y ábrelo para instalar. Cambios en CHANGELOG.md."
