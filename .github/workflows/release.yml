name: Publicar versión

# Cada cambio que llega a main compila la app y la publica en Releases.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  KEEP_RELEASES: 10
  # Huella SHA-256 del certificado oficial de GPS App (no es secreta).
  EXPECTED_CERT: 372fc8a88d1edc0649dd460676d9e961ada3dd2cd73cb1f8c0aba0a81235ef97
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión
        run: |
          VERSION=$(python3 tool/version.py version)
          BUILD=${{ github.run_number }}
          {
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "TAG=v$VERSION-b$BUILD"
            echo "APK=gps-app-v$VERSION-b$BUILD.apk"
            echo "PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo -)"
          } >> "$GITHUB_ENV"
          echo "### GPS App $VERSION (compilación $BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Revisar CHANGELOG
        run: python3 tool/version.py check

      - name: Preparar proyecto Android
        run: ./tool/prepare_android.sh

      - name: Revisar código
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Llave de firma oficial
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING=oficial" >> "$GITHUB_ENV"
            echo "Firma: llave oficial"
          else
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD. No se publica sin la firma oficial."
            exit 1
          fi

      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$SIGNING" = "oficial" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="$BUILD" \
            --dart-define=APP_COMMIT="${GITHUB_SHA::7}" \
            --dart-define=APP_BUILD_DATE="$(date -u +%Y-%m-%d)"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Archivos, firma y checksum
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          cp "$APK" gps-app.apk
          sha256sum "$APK" > "$APK.sha256"
          echo "SHA256=$(cut -d' ' -f1 "$APK.sha256")" >> "$GITHUB_ENV"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          CERT=""
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
            CERT=$(grep -m1 'SHA-256 digest' cert.txt | sed 's/.*: //')
          fi
          echo "CERT=$CERT" >> "$GITHUB_ENV"
          if [ -n "$CERT" ] && [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::El APK no quedó firmado con la llave oficial ($CERT)."
            exit 1
          fi

      - name: Notas del release
        run: |
          python3 tool/release_notes.py "$VERSION" "$BUILD" "$APK" "$SHA256" \
            "$CERT" "$SIGNING" "$PREV_TAG" notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$APK" gps-app.apk "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "GPS App $VERSION (compilación $BUILD)" \
            --notes-file notes.md \
            --latest
          echo "Descarga fija: $REPO_URL/releases/latest/download/gps-app.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Limpiar versiones antiguas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq 'sort_by(.created_at) | reverse | .[].tag_name' > tags.txt
          tail -n +$((KEEP_RELEASES + 1)) tags.txt | while read -r old; do
            echo "Borrando $old"
            gh release delete "$old" --cleanup-tag --yes || true
          done
