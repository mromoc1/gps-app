name: Revisión

# En ramas de trabajo y pull requests: revisa y compila, pero no publica.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Revisar CHANGELOG
        run: python3 tool/version.py check

      - name: Preparar proyecto Android
        run: ./tool/prepare_android.sh

      - name: Revisar código
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK de prueba
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          VERSION=$(python3 tool/version.py version)
          HAS_MAPS=false
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then HAS_MAPS=true; fi
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="prueba-${{ github.run_number }}" \
            --dart-define=APP_COMMIT="${GITHUB_SHA::7}" \
            --dart-define=HAS_GOOGLE_MAPS_KEY="$HAS_MAPS"
          cp build/app/outputs/flutter-apk/app-release.apk "gps-app-prueba-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: gps-app-prueba
          path: gps-app-prueba-*.apk
          retention-days: 7
